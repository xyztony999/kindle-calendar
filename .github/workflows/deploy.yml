name: Deploy to Aliyun

# 推送 master 自动部署；也可在 Actions 页面手动触发（Run workflow）
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/kindle-calendar:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/kindle-calendar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 不支持 OCI 1.1 provenance manifest，必须关闭，否则推送报
          # "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /www/wwwroot/kindle-calendar
            # 从 .env 的 ACR_IMAGE 提取实际使用的仓库主机（公网或 VPC 地址均可），保证登录的仓库与拉取的一致
            ACR_HOST=$(grep -E '^ACR_IMAGE=' .env | head -1 | tr -d '\r' | cut -d= -f2- | cut -d/ -f1)
            if [ -z "$ACR_HOST" ]; then echo "ERROR: .env 中未配置 ACR_IMAGE"; exit 1; fi
            echo "登录镜像仓库: ${ACR_HOST}"
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${ACR_HOST}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.acr.yml pull
            docker compose -f docker-compose.acr.yml up -d
            sleep 5
            curl -sf http://127.0.0.1:8080/health
            echo "==> 部署完成"
