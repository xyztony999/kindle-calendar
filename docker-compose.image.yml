# 启动已构建镜像（deploy.sh / deploy-remote.sh 使用）
# 配置支持 .env 覆盖：在服务器同目录创建 .env（参考 .env.example），
# 未设置时使用下方默认值

services:
  kindle-calendar:
    image: kindle-calendar:latest
    container_name: kindle-calendar
    ports:
      - "8080:8080"
    command: ["/app/start.sh"]
    environment:
      LOCATION_NAME: ${LOCATION_NAME:-北京}
      LATITUDE: ${LATITUDE:-39.9042}
      LONGITUDE: ${LONGITUDE:-116.4074}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      SCREEN_WIDTH: ${SCREEN_WIDTH:-758}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-1024}
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/dashboard.png', timeout=45).read(16)",
        ]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 90s
