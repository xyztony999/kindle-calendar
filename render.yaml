# Render.com 一键部署配置
# 推送 GitHub 后在 https://render.com 导入此仓库即可

services:
  - type: web
    name: kindle-calendar
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LOCATION_NAME
        value: 北京
      - key: LATITUDE
        value: "39.9042"
      - key: LONGITUDE
        value: "116.4074"
      - key: TIMEZONE
        value: Asia/Shanghai
      - key: SCREEN_WIDTH
        value: "758"
      - key: SCREEN_HEIGHT
        value: "1024"
      - key: FONT_PATH
        value: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
