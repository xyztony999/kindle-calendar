# 宝塔 Docker 编排专用
# 用法：编排「项目路径」填 /www/wwwroot/kindle-calendar
#       Compose 文件选本文件；或把 build.context 改成你实际放代码的目录

services:
  kindle-calendar:
    build:
      context: /www/wwwroot/kindle-calendar
      dockerfile: Dockerfile
    image: kindle-calendar:latest
    container_name: kindle-calendar
    ports:
      - "8080:8080"
    command: ["/app/start.sh"]
    environment:
      LOCATION_NAME: 北京
      LATITUDE: "39.9042"
      LONGITUDE: "116.4074"
      TIMEZONE: Asia/Shanghai
      SCREEN_WIDTH: "758"
      SCREEN_HEIGHT: "1024"
      FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/dashboard.png', timeout=45).read(16)",
        ]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 90s
